<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>7 Deadly Sins Card Game</title>
    <meta name="description" content="A strategic 4-player card game where seven deadly sins clash in a gothic cathedral. Choose your sin, master compound mechanics, and outlast your rivals across 20 rounds of judgment." />
    <meta name="theme-color" content="#1a1520" />

    <!-- Preconnect to CloudFront CDN for portraits, card art, icons, and fonts -->
    <link rel="preconnect" href="https://d2xsxph8kpxj0f.cloudfront.net" crossorigin />
    <link rel="dns-prefetch" href="https://d2xsxph8kpxj0f.cloudfront.net" />

    <!-- Preload hero image (LCP candidate) -->
    <link rel="preload" href="https://d2xsxph8kpxj0f.cloudfront.net/310419663028555243/o77RcHv9EmwRBvLHbxTivs/hero-wrath-opt_37c4a2c3.webp" as="image" type="image/webp" />

    <!-- Preload critical fonts (eliminates Google Fonts render-blocking chain) -->
    <link rel="preload" href="https://d2xsxph8kpxj0f.cloudfront.net/310419663028555243/o77RcHv9EmwRBvLHbxTivs/cinzel-latin_44fd42d0.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="https://d2xsxph8kpxj0f.cloudfront.net/310419663028555243/o77RcHv9EmwRBvLHbxTivs/cormorant-garamond-latin_d0ded694.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect to Supabase (database/auth calls) -->
    <link rel="dns-prefetch" href="https://supabase.co" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
